<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bulletin – Spuriøse projekter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300;1,6..72,400&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<script>
// Sæt tema før første tegning, så siden ikke blinker lyst i mørk tilstand.
(function(){
  var saved = null;
  try { saved = localStorage.getItem('dkpol-theme'); } catch(e){}
  if (saved === 'dark' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
    document.documentElement.setAttribute('data-theme', 'dark');
  }
})();
</script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
/* Samme variabler som index.html */
:root {
  color-scheme: light;
  --bg: #FCFBF8;
  --panel: #FFFFFF;
  --ink: #1A1916;
  --ink-2: #56524A;
  --muted: #8C887D;
  --faint: #B6B2A6;
  --line: #E8E5DD;
  --line-2: #DEDACF;
  --hover: #F4F2EC;
  --f: #2E8B57;
  --win-bg: #EBF7E4; --win-ink: #2E7D32;
  --stake-bg: #FDF4D8; --stake-line: #F0D878;
  --ch-a: #4A7A9B; --ch-b: #C25A2E; --ch-c: #C09A2B; --ch-d: #7A6F8F; --ch-base: #D4D0C4;
}
[data-theme="dark"] {
  color-scheme: dark;
  --bg: #161412;
  --panel: #1F1C19;
  --ink: #F2EEE6;
  --ink-2: #B8B2A6;
  --muted: #8A8478;
  --faint: #5E594F;
  --line: #2C2823;
  --line-2: #38332C;
  --hover: #25211C;
  --f: #5CC088;
  --win-bg: #1B2E1A; --win-ink: #7FD89A;
  --stake-bg: #2E2818; --stake-line: #4A4020;
  --ch-a: #6FA3C6; --ch-b: #E07A4D; --ch-c: #D9B54A; --ch-d: #A396BC; --ch-base: #4A453D;
}
html, body { height: 100%; }
body {
  font-family: 'Hanken Grotesk', sans-serif;
  color: var(--ink); background: var(--bg);
  display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  -webkit-font-smoothing: antialiased; letter-spacing: -0.01em;
  transition: background 0.3s ease, color 0.3s ease;
}
button { font-family: inherit; }

/* ── HEADER (som index.html) ── */
.head { flex-shrink: 0; padding: 22px 40px 18px; border-bottom: 1px solid var(--line); }
.head-row { display: flex; align-items: flex-end; gap: 32px; }
.brand { min-width: 0; flex: 1; text-decoration: none; display: block; }
.title {
  font-family: 'Newsreader', serif; font-weight: 400; font-size: 33px; line-height: 1.08;
  letter-spacing: -0.01em; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.title .it { font-style: italic; }
.head-tools { display: flex; align-items: flex-end; gap: 26px; flex-shrink: 0; }
.theme-toggle { background: none; border: 1px solid var(--line-2); border-radius: 8px; width: 34px; height: 34px; cursor: pointer; color: var(--ink-2); display: inline-flex; align-items: center; justify-content: center; transition: background 0.15s, border-color 0.15s, color 0.15s; padding: 0; }
.theme-toggle:hover { background: var(--hover); color: var(--ink); }
.theme-toggle svg { width: 16px; height: 16px; }
.theme-toggle .icon-moon { display: none; }
[data-theme="dark"] .theme-toggle .icon-sun { display: none; }
[data-theme="dark"] .theme-toggle .icon-moon { display: block; }

/* ── TABS (som index.html) ── */
.tabs { display: flex; border-bottom: 1px solid var(--line); background: var(--bg); flex-shrink: 0; padding: 0 40px; gap: 0; }
.tab { font-size: 13px; font-weight: 500; color: var(--muted); padding: 12px 18px 11px; cursor: pointer; border-bottom: 2px solid transparent; transition: color 0.15s, border-color 0.15s; background: none; margin-bottom: -1px; letter-spacing: 0.01em; text-decoration: none; }
.tab:hover { color: var(--ink); }
.tab.on { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }

/* ── LAYOUT ── */
.bl { display: grid; grid-template-columns: 320px 1fr; flex: 1; min-height: 0; }
.bl-list { border-right: 1px solid var(--line); overflow-y: auto; padding: 24px 0 32px; }
.bl-main { overflow-y: auto; padding: 40px 48px 80px; }
.bl-list::-webkit-scrollbar, .bl-main::-webkit-scrollbar { width: 9px; }
.bl-list::-webkit-scrollbar-thumb, .bl-main::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 4px; border: 2px solid var(--bg); }
.bl-msg { padding: 64px 40px; font-size: 14.5px; color: var(--ink-2); line-height: 1.6; }

/* ── LISTE ── */
.bl-label { font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink); font-weight: 700; padding: 0 22px; }
.bl-updated { font-size: 12.5px; color: var(--muted); padding: 6px 22px 0; }
.bl-group { font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); font-weight: 700; padding: 26px 22px 8px; }
.bl-item {
  display: block; width: 100%; text-align: left; background: none; border: none; cursor: pointer;
  padding: 13px 22px 14px; border-top: 1px solid var(--line); border-left: 2px solid transparent;
  color: inherit; letter-spacing: inherit; transition: background 0.15s;
}
.bl-item:last-child { border-bottom: 1px solid var(--line); }
.bl-item:hover { background: var(--hover); }
.bl-item.on { background: var(--hover); border-left-color: var(--ink); }
.bl-item-title { font-family: 'Newsreader', serif; font-size: 18.5px; line-height: 1.22; color: var(--ink); display: block; }
.bl-item-status { font-size: 13px; line-height: 1.5; color: var(--ink-2); margin-top: 5px; display: block; }
.bl-item-moved { font-size: 11.5px; color: var(--muted); margin-top: 7px; display: flex; align-items: center; gap: 7px; }
.bl-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--f); box-shadow: 0 0 0 3px color-mix(in srgb, var(--f) 22%, transparent); flex-shrink: 0; }

/* ── BRIEF ── */
.br { max-width: 720px; }
.br-eyebrow { font-size: 10.5px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-bottom: 12px; }
.br-title { font-family: 'Newsreader', serif; font-weight: 400; font-size: 40px; line-height: 1.1; letter-spacing: -0.02em; color: var(--ink); }
.br-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; margin-top: 16px; font-size: 12.5px; color: var(--muted); }
.br-pill { font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; padding: 4px 10px; border-radius: 20px; background: var(--win-bg); color: var(--win-ink); }
.br-pill.closed { background: var(--hover); color: var(--muted); }
.br-empty { margin-top: 30px; padding-top: 22px; border-top: 1px solid var(--line); font-size: 14.5px; color: var(--ink-2); font-style: italic; }

.br-sec { margin-top: 38px; }
.br-h { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); font-weight: 700; padding-bottom: 9px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
.br-sec b { font-weight: 600; color: var(--ink); }
.br-sec a { color: var(--ink); text-decoration: underline; text-decoration-color: var(--faint); text-underline-offset: 3px; }
.br-sec a:hover { text-decoration-color: var(--ink); }

.br-latest p { font-family: 'Newsreader', serif; font-size: 20px; line-height: 1.55; color: var(--ink); letter-spacing: 0; }
.br-latest p + p { margin-top: 15px; }
.br-latest b { font-weight: 500; }

.br-delta { background: var(--stake-bg); border: 1px solid var(--stake-line); border-radius: 10px; padding: 14px 18px; font-size: 14.5px; line-height: 1.6; color: var(--ink); }

.br-sub + .br-sub { margin-top: 24px; }
.br-sub h3 { font-family: 'Newsreader', serif; font-weight: 500; font-size: 19px; color: var(--ink); margin-bottom: 8px; letter-spacing: 0; }
.br-sub p { font-size: 15.5px; line-height: 1.72; color: var(--ink-2); margin-bottom: 12px; }
.br-sub p + .br-ul, .br-sub .ch + .br-ul { margin-top: 4px; }
.br-sub .br-ul { margin-top: 6px; }

/* ── DIAGRAMMER ── */
.ch { margin: 20px 0 22px; padding: 16px 18px 15px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
.ch + .ch { margin-top: 14px; }
.ch-t { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 700; color: var(--ink); margin-bottom: 14px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.ch-u { font-size: 11.5px; letter-spacing: 0; text-transform: none; font-weight: 400; color: var(--muted); }
.ch-c { margin: 14px 0 0 !important; padding-top: 10px; border-top: 1px solid var(--line); font-size: 12.5px !important; line-height: 1.55 !important; color: var(--muted) !important; }
.ch-row { display: grid; grid-template-columns: minmax(110px, 190px) 1fr auto; gap: 14px; align-items: center; padding: 6px 0; font-size: 13.5px; color: var(--ink-2); }
.ch-l { line-height: 1.35; }
.ch-track { height: 14px; background: var(--hover); border-radius: 4px; overflow: hidden; }
.ch-bar { height: 100%; border-radius: 4px; background: var(--faint); min-width: 2px; }
.ch-bar.t-a { background: var(--ch-a); } .ch-bar.t-b { background: var(--ch-b); } .ch-bar.t-c { background: var(--ch-c); } .ch-bar.t-d { background: var(--ch-d); }
.ch-v { font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; min-width: 56px; text-align: right; }
.ch-n { font-weight: 400; font-size: 12px; color: var(--muted); margin-left: 6px; }
.ch-chg { display: grid; grid-template-columns: minmax(110px, 190px) 1fr; gap: 14px; padding: 9px 0; align-items: center; border-bottom: 1px solid var(--line); font-size: 13.5px; }
.ch-chg:last-of-type { border-bottom: none; }
.ch-chg-v { min-width: 0; }
.ch-chg-n { font-variant-numeric: tabular-nums; color: var(--ink); font-weight: 600; font-size: 14px; }
.ch-chg-n .from { color: var(--muted); font-weight: 400; text-decoration: line-through; text-decoration-color: var(--faint); }
.ch-chg-n .arr { color: var(--faint); margin: 0 7px; }
.ch-chg-n .unit { font-weight: 400; font-size: 12px; color: var(--muted); margin-left: 7px; }
.ch-chg .ch-track { margin-top: 6px; height: 8px; background: var(--hover); }
.ch-chg .ch-track + .ch-track { margin-top: 3px; }
.ch-dots { display: flex; flex-wrap: wrap; gap: 7px; padding: 4px 0 10px; }
.ch-dot { width: 22px; height: 22px; border-radius: 50%; background: var(--ch-base); border: 1px solid var(--line-2); }
.ch-dot.t-a { background: var(--ch-a); border-color: transparent; } .ch-dot.t-b { background: var(--ch-b); border-color: transparent; } .ch-dot.t-c { background: var(--ch-c); border-color: transparent; } .ch-dot.t-d { background: var(--ch-d); border-color: transparent; }
.ch-leg { list-style: none; display: flex; flex-direction: column; gap: 5px; margin-top: 4px; }
.ch-leg li { display: flex; align-items: center; gap: 9px; font-size: 13px; line-height: 1.4; color: var(--ink-2); padding: 0 !important; }
.ch-leg li::before { display: none !important; }
.ch-sw { width: 11px; height: 11px; border-radius: 3px; background: var(--ch-base); flex-shrink: 0; border: 1px solid var(--line-2); }
.ch-sw.t-a { background: var(--ch-a); border-color: transparent; } .ch-sw.t-b { background: var(--ch-b); border-color: transparent; } .ch-sw.t-c { background: var(--ch-c); border-color: transparent; } .ch-sw.t-d { background: var(--ch-d); border-color: transparent; }
.ch-leg b { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--ink) !important; }
.ch-stack { display: flex; height: 30px; border-radius: 6px; overflow: hidden; gap: 2px; margin-bottom: 12px; }
.ch-seg { display: flex; align-items: center; justify-content: center; font-size: 12.5px; font-weight: 600; color: #fff; background: var(--faint); min-width: 0; font-variant-numeric: tabular-nums; }
.ch-seg.t-a { background: var(--ch-a); } .ch-seg.t-b { background: var(--ch-b); } .ch-seg.t-c { background: var(--ch-c); } .ch-seg.t-d { background: var(--ch-d); }
[data-theme="dark"] .ch-seg { color: #14120F; }
.ch-tbl-w { overflow-x: auto; }
.ch-tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.ch-tbl th { text-align: left; font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; color: var(--muted); padding: 0 12px 8px 0; border-bottom: 1px solid var(--line); }
.ch-tbl td, .ch-tbl th:first-child { padding-right: 12px; }
.ch-tbl td { padding-top: 9px; padding-bottom: 9px; border-bottom: 1px solid var(--line); color: var(--ink-2); vertical-align: top; line-height: 1.45; }
.ch-tbl tr:last-child td { border-bottom: none; }
.ch-tbl td:first-child { font-weight: 600; color: var(--ink); }
.ch-tbl.dense th, .ch-tbl.dense td { text-align: center; } .ch-tbl.dense th:first-child, .ch-tbl.dense td:first-child { text-align: left; }
.ch-tag { display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 12px; font-weight: 600; background: var(--hover); color: var(--ink-2); }
.ch-tag.yes { background: var(--win-bg); color: var(--win-ink); }
.ch-tag.mid { background: var(--stake-bg); color: var(--ink); }
.ch-tag.no { background: color-mix(in srgb, var(--ch-b) 18%, transparent); color: var(--ch-b); }
.br-ul { list-style: none; }
.br-ul li { position: relative; padding-left: 18px; font-size: 14.5px; line-height: 1.65; color: var(--ink-2); }
.br-ul li + li { margin-top: 7px; }
.br-ul li::before { content: ''; position: absolute; left: 3px; top: 0.72em; width: 5px; height: 5px; border-radius: 50%; background: var(--faint); }

.br-row { display: grid; grid-template-columns: 170px 1fr; gap: 20px; padding: 13px 0; border-bottom: 1px solid var(--line); font-size: 14.5px; line-height: 1.6; }
.br-row:first-of-type { padding-top: 0; }
.br-row:last-child { border-bottom: none; }
.br-row-k { font-weight: 600; color: var(--ink); }
.br-row-v { color: var(--ink-2); min-width: 0; }
.br-row-sub { display: block; margin-top: 5px; font-size: 13px; color: var(--muted); }
.br-row.date { grid-template-columns: 124px 1fr; }
.br-row.date .br-row-k { font-weight: 500; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; padding-top: 1px; }
.br-outlet { font-size: 12px; margin-left: 6px; white-space: nowrap; }
.br-sec a.br-outlet, .br-outlet { color: var(--muted); }

.br-src { list-style: none; }
.br-src li { font-size: 14px; line-height: 1.55; color: var(--ink-2); padding: 9px 0; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
.br-src li:last-child { border-bottom: none; }
.br-tag { display: inline-block; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; color: var(--muted); background: var(--hover); padding: 3px 8px; border-radius: 5px; margin-left: 8px; white-space: nowrap; vertical-align: 1px; }

/* ── NOTER OG KILDEHENVISNINGER ── */
.br-wrap { position: relative; }
.nt { border-bottom: 1px dotted var(--muted); cursor: help; border-radius: 2px; transition: background 0.15s, border-color 0.15s; }
.nt:hover, .nt.on, .nt:focus-visible { background: var(--stake-bg); border-bottom-color: var(--ink-2); outline: none; }
.cite { font-family: 'Hanken Grotesk', sans-serif; font-size: 10.5px; font-weight: 600; line-height: 0; vertical-align: super; letter-spacing: 0; white-space: nowrap; margin-left: 1px; }
.br-sec .cite a { color: var(--muted); text-decoration: none; padding: 2px 1px; border-radius: 3px; font-variant-numeric: tabular-nums; }
.br-sec .cite a:hover, .br-sec .cite a.on, .br-sec .cite a:focus-visible { color: var(--ink); background: var(--stake-bg); outline: none; }
.cite a + a::before { content: ','; color: var(--faint); margin-right: 1px; }
.br-src-n { display: inline-block; min-width: 22px; font-size: 11.5px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }

.note {
  position: absolute; top: 0; left: 0; width: 272px; z-index: 40;
  background: var(--panel); border: 1px solid var(--line-2); border-radius: 10px;
  padding: 14px 16px 15px; box-shadow: 0 10px 30px rgba(20, 18, 14, 0.10);
  font-size: 13.5px; line-height: 1.58; color: var(--ink-2);
  opacity: 0; visibility: hidden; transform: translateX(8px);
  transition: opacity 0.16s ease, transform 0.16s ease, visibility 0s linear 0.16s;
}
.note.show { opacity: 1; visibility: visible; transform: none; transition: opacity 0.16s ease, transform 0.16s ease; }
.note-k { font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700; color: var(--muted); }
.note-t { font-family: 'Newsreader', serif; font-size: 18.5px; line-height: 1.22; color: var(--ink); margin-top: 5px; letter-spacing: 0; }
.note-b { margin-top: 7px; }
.note-b b { font-weight: 600; color: var(--ink); }
.note-s { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.note-s a { color: var(--ink-2); text-decoration: underline; text-decoration-color: var(--faint); text-underline-offset: 3px; }
.note-s a:hover { color: var(--ink); text-decoration-color: var(--ink); }
.note-s .br-tag { margin-left: 0; margin-right: 6px; }
/* Bred skærm: noten står i en margen til højre for teksten. */
@media (min-width: 1240px) {
  .br-wrap { max-width: 1028px; }
  .br { max-width: min(720px, calc(100% - 308px)); }
}

/* ── TELEFON (samme breakpoint som index.html) ── */
@media (max-width: 820px) {
  body { height: auto; min-height: 100vh; overflow: auto; }
  .head { padding: 18px 20px 14px; position: sticky; top: 0; background: var(--bg); z-index: 50; }
  .head-row { align-items: center; gap: 16px; }
  .title { font-size: 25px; white-space: normal; }
  .tabs { padding: 0 20px; overflow-x: auto; }
  .tab { white-space: nowrap; }
  .bl { display: block; }
  .bl-list { border-right: none; border-bottom: 1px solid var(--line); overflow: visible; padding: 22px 0 0; }
  .bl-label, .bl-updated, .bl-group, .bl-item { padding-left: 20px; padding-right: 20px; }
  .bl-item:last-child { border-bottom: none; }
  .bl-main { overflow: visible; padding: 30px 20px 64px; scroll-margin-top: 90px; }
  .bl-msg { padding: 40px 20px; }
  .br-title { font-size: 30px; }
  .br-latest p { font-size: 18.5px; }
  .br-row, .br-row.date { grid-template-columns: 1fr; gap: 3px; }
  .ch { padding: 14px 14px 13px; }
  .ch-row { grid-template-columns: 1fr auto; gap: 4px 10px; }
  .ch-row .ch-l { grid-column: 1 / -1; }
  .ch-chg { grid-template-columns: 1fr; gap: 4px; }
  /* Noten ligger som et ark i bunden af skærmen. */
  .note { position: fixed; top: auto !important; left: 12px !important; right: 12px; bottom: 12px; width: auto; transform: translateY(8px); box-shadow: 0 10px 40px rgba(20, 18, 14, 0.22); }
}
</style>
</head>
<body>

<header class="head">
  <div class="head-row">
    <a class="brand" href="index.html">
      <div class="title"><span class="it">Spuriøse</span> projekter</div>
    </a>
    <div class="head-tools">
      <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()" title="Skift tema" aria-label="Skift mellem lys og mørk tilstand">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </div>
</header>

<nav class="tabs" id="tabs">
  <a class="tab" href="index.html">Forside</a>
  <a class="tab on" href="bulletin.html" aria-current="page">Bulletin</a>
</nav>

<div class="bl" id="bl">
  <aside class="bl-list" id="bl-list"></aside>
  <main class="bl-main" id="bl-main"><div class="bl-msg">Henter Bulletin …</div></main>
</div>

<script>
// ── Tema (samme nøgle som index.html) ────────────────────────────────────────
function applyTheme(theme) {
  if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  else document.documentElement.removeAttribute('data-theme');
}
function toggleTheme() {
  var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  var next = isDark ? 'light' : 'dark';
  applyTheme(next);
  try { localStorage.setItem('dkpol-theme', next); } catch(e){}
}

// ── Tekst og links ───────────────────────────────────────────────────────────
// Al tekst fra JSON escapes. Kun <b>…</b> slippes igennem.
function esc(v) {
  return String(v == null ? '' : v)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function rich(v) {
  return esc(v).replace(/&lt;b&gt;([\s\S]*?)&lt;\/b&gt;/g, '<b>$1</b>');
}
function safeUrl(u) {
  return (typeof u === 'string' && /^https?:\/\//i.test(u)) ? u : null;
}
function link(url, label, cls) {
  var u = safeUrl(url);
  if (!u) return label ? '<span' + (cls ? ' class="' + cls + '"' : '') + '>' + rich(label) + '</span>' : '';
  return '<a' + (cls ? ' class="' + cls + '"' : '') + ' href="' + esc(u) + '" target="_blank" rel="noopener noreferrer">' + rich(label || u) + '</a>';
}
function arr(v) { return Array.isArray(v) ? v : []; }

// ── Noter og kildehenvisninger ───────────────────────────────────────────────
// [3] eller [3, 5] i teksten henviser til historiens kilder, talt fra 1.
// Ord, der står som "term" eller "aliases" i historiens "notes", får en note,
// første gang de optræder i hvert afsnit.
var LETTER = '0-9A-Za-zÀ-ÖØ-öø-ÿ';
var CUR = null;     // den viste historie
var TERMS = null;   // { re, map } for den viste historie
function buildTerms(s) {
  var map = {}, keys = [];
  arr(s && s.notes).forEach(function(n, i) {
    if (!n || !has(n.text)) return;
    [n.term].concat(arr(n.aliases)).forEach(function(t) {
      if (!has(t)) return;
      var k = esc(String(t).trim());
      if (!(k in map)) { map[k] = i; keys.push(k); }
    });
  });
  if (!keys.length) return null;
  keys.sort(function(a, b){ return b.length - a.length; });
  var alt = keys.map(function(k){ return k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }).join('|');
  return { map: map, re: new RegExp('(^|[^' + LETTER + '])(' + alt + ')(?=s?(?:[^' + LETTER + ']|$))', 'g') };
}
// seen: et objekt pr. afsnit, så samme note kun markeres én gang i afsnittet.
function note(v, seen) {
  var html = rich(v);
  var nsrc = arr(CUR && CUR.sources).length;
  html = html.replace(/\s*\[(\d+(?:\s*,\s*\d+)*)\]/g, function(m, list) {
    var nums = list.split(',').map(function(x){ return parseInt(x, 10); }).sort(function(a, b){ return a - b; });
    if (nums.some(function(n){ return n < 1 || n > nsrc; })) return m;
    return '<sup class="cite">' + nums.map(function(n) {
      var u = safeUrl(CUR.sources[n - 1] && CUR.sources[n - 1].url);
      return '<a data-c="' + n + '"' + (u ? ' href="' + esc(u) + '" target="_blank" rel="noopener noreferrer"' : ' tabindex="0"') + '>' + n + '</a>';
    }).join('') + '</sup>';
  });
  if (!TERMS) return html;
  seen = seen || {};
  var inCite = false;
  return html.split(/(<[^>]+>)/).map(function(part) {
    if (part.charAt(0) === '<') { if (/^<sup/.test(part)) inCite = true; else if (/^<\/sup/.test(part)) inCite = false; return part; }
    if (inCite) return part;
    return part.replace(TERMS.re, function(m, pre, term) {
      var i = TERMS.map[term];
      if (seen[i]) return m;
      seen[i] = true;
      return pre + '<span class="nt" tabindex="0" data-n="' + i + '">' + term + '</span>';
    });
  }).join('');
}
function has(v) { return typeof v === 'string' ? v.trim() !== '' : v != null; }

// ── Datoer ───────────────────────────────────────────────────────────────────
var MONTHS = ['januar','februar','marts','april','maj','juni','juli','august','september','oktober','november','december'];
function parseDay(s) {
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || '');
  return m ? { y: +m[1], m: +m[2], d: +m[3] } : null;
}
function fmtDay(s) {
  var p = parseDay(s);
  if (!p) return has(s) ? String(s) : '';
  return p.d + '. ' + MONTHS[p.m - 1] + ' ' + p.y;
}
function fmtStamp(iso) {
  var d = new Date(iso);
  if (!has(iso) || isNaN(d)) return '';
  try {
    var parts = {};
    new Intl.DateTimeFormat('da-DK', { timeZone: 'Europe/Copenhagen', weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false })
      .formatToParts(d).forEach(function(p){ parts[p.type] = p.value; });
    return parts.weekday + ' ' + parts.day + '. ' + parts.month + ' ' + parts.year + ' kl. ' + parts.hour + '.' + parts.minute;
  } catch(e) { return d.toLocaleString('da-DK'); }
}
// Hele dage mellem en dato og i dag, regnet i dansk tid.
function daysSince(s) {
  var p = parseDay(s);
  if (!p) return Infinity;
  var t = new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/Copenhagen', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
  var n = parseDay(t);
  if (!n) return Infinity;
  return Math.round((Date.UTC(n.y, n.m - 1, n.d) - Date.UTC(p.y, p.m - 1, p.d)) / 86400000);
}

// ── Tilstand ─────────────────────────────────────────────────────────────────
var DATA = null;
var STORIES = [];

function currentId() {
  var h = '';
  try { h = decodeURIComponent(location.hash.replace(/^#/, '')); } catch(e){}
  for (var i = 0; i < STORIES.length; i++) if (STORIES[i].id === h) return h;
  var first = STORIES.filter(function(s){ return s.status !== 'closed'; })[0] || STORIES[0];
  return first ? first.id : null;
}

// ── Liste ────────────────────────────────────────────────────────────────────
function renderList(activeId) {
  var groups = [
    ['Korte forløb', STORIES.filter(function(s){ return s.status !== 'closed' && s.kind !== 'long'; })],
    ['Lange forløb', STORIES.filter(function(s){ return s.status !== 'closed' && s.kind === 'long'; })],
    ['Afsluttede',   STORIES.filter(function(s){ return s.status === 'closed'; })]
  ];
  var h = '<div class="bl-label">Bulletin</div>';
  var stamp = fmtStamp(DATA.updated_at);
  if (stamp) h += '<div class="bl-updated">Opdateret ' + esc(stamp) + '</div>';
  groups.forEach(function(g) {
    if (!g[1].length) return;
    h += '<div class="bl-group">' + g[0] + '</div><div>';
    g[1].forEach(function(s) {
      h += '<button class="bl-item' + (s.id === activeId ? ' on' : '') + '" data-id="' + esc(s.id) + '"' + (s.id === activeId ? ' aria-current="true"' : '') + '>';
      h += '<span class="bl-item-title">' + rich(s.title) + '</span>';
      if (has(s.status_line)) h += '<span class="bl-item-status">' + rich(s.status_line) + '</span>';
      if (has(s.last_moved)) {
        h += '<span class="bl-item-moved">' + (daysSince(s.last_moved) < 2 && daysSince(s.last_moved) >= 0 ? '<span class="bl-dot" title="Har rykket sig inden for to dage"></span>' : '') +
             'Rykkede sig sidst ' + esc(fmtDay(s.last_moved)) + '</span>';
      }
      h += '</button>';
    });
    h += '</div>';
  });
  document.getElementById('bl-list').innerHTML = h;
}

// ── Brief ────────────────────────────────────────────────────────────────────
// ── Diagrammer ───────────────────────────────────────────────────────────────
// Ren HTML/CSS, ingen biblioteker. Alle tal og tekster kommer fra "charts" i JSON.
function fnum(v, dec) {
  var n = Number(v);
  if (!isFinite(n)) return esc(v);
  var d = (dec == null) ? (n % 1 ? 1 : 0) : +dec;
  return n.toLocaleString('da-DK', { minimumFractionDigits: d, maximumFractionDigits: d });
}
function tone(t) { return /^[abcd]$/.test(t) ? ' t-' + t : ''; }
function chartHtml(c) {
  if (!c || !has(c.type)) return '';
  var data = arr(c.data), h = '<figure class="ch ct-' + esc(c.type) + '">';
  if (has(c.title)) h += '<figcaption class="ch-t">' + rich(c.title) + (has(c.unit) ? '<span class="ch-u">' + rich(c.unit) + '</span>' : '') + '</figcaption>';
  if (c.type === 'bars') {
    var max = +c.max || Math.max.apply(null, data.map(function(d){ return +d.value || 0; })) || 1;
    h += data.map(function(d) {
      var w = Math.max(0, Math.min(100, (+d.value || 0) / max * 100));
      return '<div class="ch-row"><div class="ch-l">' + rich(d.label) + '</div><div class="ch-track"><div class="ch-bar' + tone(d.tone) + (d.hl ? ' hl' : '') + '" style="width:' + w + '%"></div></div>' +
        '<div class="ch-v">' + fnum(d.value, c.dec) + (has(d.note) ? '<span class="ch-n">' + rich(d.note) + '</span>' : '') + '</div></div>';
    }).join('');
  } else if (c.type === 'change') {
    h += data.map(function(d) {
      var m = Math.max(+d.from || 0, +d.to || 0) || 1;
      return '<div class="ch-chg"><div class="ch-l">' + rich(d.label) + '</div><div class="ch-chg-v"><div class="ch-chg-n"><span class="from">' + fnum(d.from, d.dec) + '</span><span class="arr">→</span>' + fnum(d.to, d.dec) +
        (has(d.unit) ? '<span class="unit">' + rich(d.unit) + '</span>' : '') + '</div>' +
        '<div class="ch-track"><div class="ch-bar" style="width:' + ((+d.from || 0) / m * 100) + '%"></div></div>' +
        '<div class="ch-track"><div class="ch-bar t-a" style="width:' + ((+d.to || 0) / m * 100) + '%"></div></div></div></div>';
    }).join('');
  } else if (c.type === 'dots') {
    h += '<div class="ch-dots" role="img" aria-label="' + esc(data.map(function(d){ return d.count + ' ' + d.label; }).join(', ')) + '">' +
      data.map(function(d) { var x = ''; for (var i = 0; i < (+d.count || 0); i++) x += '<span class="ch-dot' + tone(d.tone) + '"></span>'; return x; }).join('') + '</div>' +
      '<ul class="ch-leg">' + data.map(function(d){ return '<li><span class="ch-sw' + tone(d.tone) + '"></span>' + rich(d.label) + '<b>' + fnum(d.count, 0) + '</b></li>'; }).join('') + '</ul>';
  } else if (c.type === 'stack') {
    var tot = data.reduce(function(s, d){ return s + (+d.value || 0); }, 0) || 1;
    h += '<div class="ch-stack">' + data.map(function(d){ return '<div class="ch-seg' + tone(d.tone) + '" style="flex:' + (+d.value || 0) + ' 1 0" title="' + esc(d.label) + '">' + fnum(d.value, c.dec) + '</div>'; }).join('') + '</div>' +
      '<ul class="ch-leg">' + data.map(function(d){ return '<li><span class="ch-sw' + tone(d.tone) + '"></span>' + rich(d.label) + '<b>' + fnum(d.value, c.dec) + '</b></li>'; }).join('') + '</ul>';
  } else if (c.type === 'matrix') {
    var cols = arr(c.columns), dense = cols.length > 2 && data.every(function(r){ return arr(r.cells).every(function(x){ var t = typeof x === 'string' ? x : (x && x.t); return !t || String(t).length < 3; }); });
    h += '<div class="ch-tbl-w"><table class="ch-tbl' + (dense ? ' dense' : '') + '"><thead><tr><th></th>' + cols.map(function(x){ return '<th>' + rich(x) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      data.map(function(r) {
        return '<tr><td>' + rich(r.label) + '</td>' + arr(r.cells).map(function(x) {
          var t = typeof x === 'string' ? x : (x && x.t), k = (x && x.tone) || '';
          return '<td>' + (has(t) ? (/^(yes|mid|no)$/.test(k) ? '<span class="ch-tag ' + k + '">' + rich(t) + '</span>' : rich(t)) : '') + '</td>';
        }).join('') + '</tr>';
      }).join('') + '</tbody></table></div>';
  } else return '';
  if (has(c.caption)) h += '<p class="ch-c">' + note(c.caption) + '</p>';
  return h + '</figure>';
}
function sec(title, body) { return '<section class="br-sec"><h2 class="br-h">' + title + '</h2>' + body + '</section>'; }
function ul(items) {
  return '<ul class="br-ul">' + items.map(function(i){ return '<li>' + note(i) + '</li>'; }).join('') + '</ul>';
}

function renderBrief(s) {
  var main = document.getElementById('bl-main');
  hideNote(true);
  CUR = s || null;
  TERMS = buildTerms(s);
  if (!s) { main.innerHTML = '<div class="bl-msg">Der er ingen historier i Bulletin endnu.</div>'; return; }
  var latest = s.latest || {};
  var paras = arr(latest.paragraphs).filter(has);
  var closed = s.status === 'closed';

  var h = '<div class="br-wrap"><article class="br">';
  h += '<div class="br-eyebrow">' + (s.kind === 'long' ? 'Langt forløb' : 'Kort forløb') + '</div>';
  h += '<h1 class="br-title">' + rich(s.title) + '</h1>';
  h += '<div class="br-meta"><span class="br-pill' + (closed ? ' closed' : '') + '">' + (closed ? 'Afsluttet' : 'Følges') + '</span>';
  if (has(latest.date)) h += '<span>Opdateret ' + esc(fmtDay(latest.date)) + '</span>';
  h += '</div>';

  if (!paras.length) {
    h += '<p class="br-empty">Briefet skrives ved første morgenkørsel.</p></article></div>';
    main.innerHTML = h;
    return;
  }

  h += sec('Her står sagen', '<div class="br-latest">' + paras.map(function(p){ return '<p>' + note(p) + '</p>'; }).join('') + '</div>');

  if (has(s.delta)) h += sec('Nyt siden sidst', '<div class="br-delta">' + note(s.delta) + '</div>');

  var subs = arr(s.substance).filter(function(b){ return b && (has(b.heading) || has(b.body) || arr(b.items).length || arr(b.charts).length); });
  if (subs.length) {
    h += sec('Substansen', subs.map(function(b) {
      var x = '<div class="br-sub">';
      if (has(b.heading)) x += '<h3>' + rich(b.heading) + '</h3>';
      // Blanke linjer i "body" giver nye afsnit; noter markeres højst én gang pr. afsnit.
      if (has(b.body)) x += String(b.body).split(/\n\s*\n/).map(function(p){ return '<p>' + note(p.trim()) + '</p>'; }).join('');
      arr(b.charts).forEach(function(c){ x += chartHtml(c); });
      var items = arr(b.items).filter(has);
      if (items.length) x += ul(items);
      return x + '</div>';
    }).join(''));
  }

  var players = arr(s.players).filter(function(p){ return p && has(p.name); });
  if (players.length) {
    h += sec('Aktørerne', players.map(function(p) {
      var seen = {};
      return '<div class="br-row"><div class="br-row-k">' + note(p.name, seen) + '</div><div class="br-row-v">' + note(p.wants, seen) +
        (has(p.latest) ? '<span class="br-row-sub">Senest: ' + note(p.latest, seen) + '</span>' : '') + '</div></div>';
    }).join(''));
  }

  var tl = arr(s.timeline).filter(function(t){ return t && has(t.text); });
  if (tl.length) {
    h += sec('Tidslinje', tl.map(function(t) {
      var src = safeUrl(t.url) ? link(t.url, has(t.outlet) ? t.outlet : 'Kilde', 'br-outlet')
              : (has(t.outlet) ? '<span class="br-outlet">' + rich(t.outlet) + '</span>' : '');
      return '<div class="br-row date"><div class="br-row-k">' + esc(fmtDay(t.date)) + '</div><div class="br-row-v">' + note(t.text) + ' ' + src + '</div></div>';
    }).join(''));
  }

  var open = arr(s.open).filter(has);
  if (open.length) h += sec('Ubekræftet og åbent', ul(open));

  var log = arr(s.changelog).filter(function(c){ return c && has(c.text); });
  if (log.length) {
    h += sec('Ændringslog', log.map(function(c) {
      return '<div class="br-row date"><div class="br-row-k">' + esc(fmtDay(c.date)) + '</div><div class="br-row-v">' + rich(c.text) + '</div></div>';
    }).join(''));
  }

  var srcs = arr(s.sources).filter(function(x){ return x && (has(x.title) || has(x.url)); });
  if (srcs.length) {
    // Nummeret er kildens plads i JSON-listen – det samme tal, som [n] i teksten peger på.
    h += sec('Kilder', '<ul class="br-src">' + arr(s.sources).map(function(x, i) {
      if (!x || !(has(x.title) || has(x.url))) return '';
      return '<li><span class="br-src-n">' + (i + 1) + '</span>' + link(x.url, has(x.title) ? x.title : x.url) + (readTag(x) ? '<span class="br-tag">' + readTag(x) + '</span>' : '') + '</li>';
    }).join('') + '</ul>');
  }

  main.innerHTML = h + '</article><aside class="note" id="note" role="note" aria-live="polite"></aside></div>';
}
function readTag(x) { return x.read === 'full' ? 'læst i fuld længde' : (x.read === 'excerpt' ? 'læst i uddrag' : ''); }

// ── Notekortet ───────────────────────────────────────────────────────────────
// Bred skærm: i margenen til højre, ud for ordet. Smallere: under ordet.
// Telefon: som et ark i bunden (styres af CSS).
var NOTE_FOR = null, NOTE_TIMER = null, NOTE_AT = 0;
var KINDS = { person: 'Person', fakta: 'Fakta', begreb: 'Begreb', sted: 'Sted', organisation: 'Organisation' };
function noteHtml(el) {
  if (!CUR) return '';
  if (el.hasAttribute('data-c')) {
    var n = +el.getAttribute('data-c'), x = arr(CUR.sources)[n - 1];
    if (!x) return '';
    return '<div class="note-k">Kilde ' + n + '</div><div class="note-t">' + rich(has(x.title) ? x.title : x.url) + '</div>' +
      '<div class="note-s">' + (readTag(x) ? '<span class="br-tag">' + readTag(x) + '</span>' : '') + (safeUrl(x.url) ? link(x.url, 'Åbn kilden') : '') + '</div>';
  }
  var t = arr(CUR.notes)[+el.getAttribute('data-n')];
  if (!t) return '';
  var out = '<div class="note-k">' + esc(KINDS[t.kind] || 'Note') + '</div>' +
    '<div class="note-t">' + rich(has(t.title) ? t.title : t.term) + '</div><div class="note-b">' + rich(t.text) + '</div>';
  if (safeUrl(t.url)) out += '<div class="note-s">Kilde: ' + link(t.url, has(t.outlet) ? t.outlet : t.url) + '</div>';
  return out;
}
function showNote(el) {
  var card = document.getElementById('note');
  if (!card) return;
  clearTimeout(NOTE_TIMER);
  if (NOTE_FOR === el && card.classList.contains('show')) return;
  var html = noteHtml(el);
  if (!html) return;
  if (NOTE_FOR) NOTE_FOR.classList.remove('on');
  NOTE_FOR = el; NOTE_AT = Date.now(); el.classList.add('on');
  card.innerHTML = html;
  var wrap = card.parentNode, art = wrap.querySelector('.br');
  var w = wrap.getBoundingClientRect(), r = el.getBoundingClientRect();
  var top, left;
  if (wrap.clientWidth - art.offsetWidth >= card.offsetWidth + 28) {       // margen
    left = art.offsetWidth + 36;
    top = r.top - w.top - 16;
  } else {                                                                  // under ordet
    left = Math.max(0, Math.min(r.left - w.left, wrap.clientWidth - card.offsetWidth));
    top = r.bottom - w.top + 9;
  }
  top = Math.max(0, Math.min(top, wrap.clientHeight - card.offsetHeight));
  card.style.left = left + 'px';
  card.style.top = top + 'px';
  card.classList.add('show');
}
function hideNote(now) {
  clearTimeout(NOTE_TIMER);
  var go = function() {
    var card = document.getElementById('note');
    if (card) card.classList.remove('show');
    if (NOTE_FOR) NOTE_FOR.classList.remove('on');
    NOTE_FOR = null;
  };
  if (now) go(); else NOTE_TIMER = setTimeout(go, 240);
}
(function() {
  var main = document.getElementById('bl-main');
  var SEL = '.nt, .cite a';
  var hover = window.matchMedia('(hover: hover)');
  main.addEventListener('mouseover', function(e) {
    if (!hover.matches) return;
    var el = e.target.closest(SEL);
    if (el) showNote(el);
    else if (e.target.closest('.note')) clearTimeout(NOTE_TIMER);
  });
  main.addEventListener('mouseout', function(e) {
    if (!hover.matches) return;
    if (e.target.closest(SEL) || e.target.closest('.note')) hideNote();
  });
  main.addEventListener('focusin', function(e) { var el = e.target.closest(SEL); if (el) showNote(el); });
  main.addEventListener('focusout', function(e) { if (e.target.closest(SEL)) hideNote(); });
  // Berøring: første tryk viser noten, kilden åbnes fra kortet.
  main.addEventListener('click', function(e) {
    var el = e.target.closest(SEL);
    if (el) {
      var link = el.hasAttribute('href');
      if (NOTE_FOR === el && document.getElementById('note').classList.contains('show')) {
        // Et tryk giver først fokus (som viser noten) og så klik: luk kun, hvis den har stået lidt.
        if (!link && !hover.matches && Date.now() - NOTE_AT > 400) hideNote(true);
      } else {
        if (link && !hover.matches) e.preventDefault();
        showNote(el);
      }
      if (link && !hover.matches && Date.now() - NOTE_AT < 400) {
        e.preventDefault();   // første tryk på et kildetal viser kortet; linket åbnes derfra
      }
      return;
    }
    if (!e.target.closest('.note')) hideNote(true);
  });
  document.addEventListener('keydown', function(e) { if (e.key === 'Escape') hideNote(true); });
})();

function render() {
  var id = currentId();
  renderList(id);
  renderBrief(STORIES.filter(function(s){ return s.id === id; })[0]);
}

// Klik vælger historien og sætter hash; hashchange dækker frem/tilbage i browseren.
document.getElementById('bl-list').addEventListener('click', function(e) {
  var btn = e.target.closest('.bl-item');
  if (!btn) return;
  var id = btn.getAttribute('data-id');
  location.hash = encodeURIComponent(id);
  render();
  var main = document.getElementById('bl-main');
  if (window.matchMedia('(max-width: 820px)').matches) main.scrollIntoView({ behavior: 'smooth', block: 'start' });
  else main.scrollTop = 0;
});
window.addEventListener('hashchange', function(){ if (DATA) render(); });

fetch('./bulletin.json', { cache: 'no-store' })
  .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
  .then(function(d) {
    if (!d || !Array.isArray(d.stories)) throw new Error('Uventet format');
    DATA = d;
    STORIES = d.stories.filter(function(s){ return s && has(s.id); });
    render();
  })
  .catch(function() {
    document.getElementById('bl-list').innerHTML = '<div class="bl-label">Bulletin</div>';
    document.getElementById('bl-main').innerHTML = '<div class="bl-msg">Bulletin kunne ikke hentes lige nu. Prøv igen om lidt.</div>';
  });
</script>
