[project]
name = "ff"
version = "0.1.0"
description = "Personal advisory CLI for a Sleeper fantasy football league"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "pandas>=2.2",
    "pyarrow>=25.0.1",
]

[project.scripts]
ff = "ff.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"
